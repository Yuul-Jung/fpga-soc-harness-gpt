name: Continuous FPGA SoC research and capstone maintenance

on:
  push:
    branches: [main]
    # (변경) 정책/워크플로 수정 시 조사→검증→신규 캡스톤 전체 재실행.
    paths:
      - harness/creative.py
      - .github/workflows/continuous-pipeline.yml
  schedule:
    # Coordinated UTC slots; Asia/Seoul is UTC+9.
    # 1h research: xx:07 KST
    - cron: '7 * * * *'
    # 90-minute review, UTC anchors: 00:17, 01:47, 03:17, 04:47 ...
    - cron: '17 0-23/3 * * *'
    - cron: '47 1-23/3 * * *'
    # 150-minute factory, UTC anchors: 00:27, 02:57, 05:27 ...
    - cron: '27 0,5,10,15,20 * * *'
    - cron: '57 2,7,12,17,22 * * *'
  workflow_dispatch:
    inputs:
      stage:
        description: "Run one stage or the full pipeline"
        type: choice
        options: [all, research, review, factory]
        default: all

permissions:
  contents: write

concurrency:
  group: continuous-fpga-soc-catalog-pipeline
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline RTL simulation tools
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Resolve current cadence
        id: stage
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUEST: ${{ inputs.stage }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            # (변경) 수동 코드 수정 후 전체 파이프라인을 즉시 재검증한다.
            stage="all"
          elif [[ -n "$REQUEST" ]]; then
            stage="$REQUEST"
          else
            case "$SCHEDULE" in
              "7 * * * *") stage="research" ;;
              "17 0-23/3 * * *"|"47 1-23/3 * * *") stage="review" ;;
              "27 0,5,10,15,20 * * *"|"57 2,7,12,17,22 * * *") stage="factory" ;;
              *) echo "Unknown schedule: $SCHEDULE"; exit 1 ;;
            esac
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "Running stage: $stage"
      - name: Execute selected stage and preserve audit artifacts
        id: execute
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ steps.stage.outputs.stage }}
        shell: bash
        run: |
          set -uo pipefail
          result=0
          case "$STAGE" in
            research)
              python -m harness.research || result=$?
              if [ "$result" -eq 0 ]; then python -m harness.maintenance --stage research || result=$?; fi
              ;;
            review)
              python -m harness.review || result=$?
              if [ "$result" -eq 0 ]; then python -m harness.refine || result=$?; fi
              if [ "$result" -eq 0 ]; then python -m harness.maintenance --stage review || result=$?; fi
              ;;
            factory)
              python -m harness.factory || result=$?
              if [ "$result" -eq 0 ]; then python -m harness.maintenance --stage factory || result=$?; fi
              ;;
            all)
              python -m harness.research || result=$?
              if [ "$result" -eq 0 ]; then python -m harness.review || result=$?; fi
              if [ "$result" -eq 0 ]; then python -m harness.refine || result=$?; fi
              if [ "$result" -eq 0 ]; then python -m harness.factory || result=$?; fi
              if [ "$result" -eq 0 ]; then python -m harness.maintenance --stage factory || result=$?; fi
              ;;
            *) result=2 ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save catalog, existing-material revisions and generated capstones
        shell: bash
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$STAGE" in
            research)
              git add catalog/discovered.json catalog/research_history.json
              git add catalog/material_audit.json catalog/material_audit_history.json site/
              ;;
            review)
              git add catalog/reviewed.json catalog/improvement_backlog.json catalog/proposals.json
              git add catalog/material_audit.json catalog/material_audit_history.json site/
              ;;
            factory)
              git add catalog/factory_history.json catalog/material_audit.json
              git add catalog/material_audit_history.json capstones/ site/
              ;;
            all)
              git add catalog/ capstones/ site/
              ;;
          esac
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "automation: $STAGE FPGA SoC research/review/capstone cycle"
          if git push origin "HEAD:$GITHUB_REF_NAME"; then
            exit 0
          fi
          # (변경) site-sync 또는 다른 예약이 main을 먼저 갱신한 경우
          # 오래된 결과를 강제 push하지 않고 최신 main에서 동일 단계를 재실행한다.
          for attempt in 1 2 3; do
            echo "Concurrent push detected; rerun $STAGE on latest main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            case "$STAGE" in
              research)
                python -m harness.research
                python -m harness.maintenance --stage research
                ;;
              review)
                python -m harness.review
                python -m harness.refine
                python -m harness.maintenance --stage review
                ;;
              factory)
                python -m harness.factory
                python -m harness.maintenance --stage factory
                ;;
              all)
                python -m harness.research
                python -m harness.review
                python -m harness.refine
                python -m harness.factory
                python -m harness.maintenance --stage factory
                ;;
              *) echo "Unknown stage: $STAGE" >&2; exit 2 ;;
            esac
            git add catalog/ capstones/ site/
            if git diff --cached --quiet; then
              echo "Latest main already has matching generated outputs."
              exit 0
            fi
            git commit -m "automation: $STAGE FPGA SoC cycle after concurrent update"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
          done
          echo "ERROR: FPGA SoC pipeline publish retries exhausted" >&2
          exit 1
      - name: Report stage validation failure after archiving evidence
        if: steps.execute.outputs.result != '0'
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          RESULT: ${{ steps.execute.outputs.result }}
        run: |
          echo "::error::$STAGE cycle failed with exit code $RESULT; inspect committed audit and run logs."
          exit 1
